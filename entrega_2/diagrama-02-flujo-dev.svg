<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-label="Flujo de operacion de Terraform en la cuenta AWS de desarrollo: el ingeniero de datos y el pipeline CI/CD asumen un rol en la cuenta, y Terraform ejecuta el ciclo de cinco pasos: bloquear en DynamoDB locks-dev, leer el estado de s3 tfstate-dev, aplicar cambios en Kinesis y Redshift, escribir el estado en S3 y liberar el bloqueo.">
  <rect width="900" height="680" fill="#FFFFFF"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <polygon points="0,1 10,5 0,9" fill="#4A5A6B"/>
    </marker>
    <marker id="arl" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <polygon points="0,1 10,5 0,9" fill="#A9700E"/>
    </marker>
  </defs>

  <!-- ============ INICIADORES ============ -->
  <rect x="170" y="20" width="220" height="58" rx="6" fill="#FFFFFF" stroke="#B9C4CF" stroke-width="1.2"/>
  <text x="280" y="45" text-anchor="middle" font-size="13.5" font-weight="600" fill="#131C26" font-family="system-ui, sans-serif">Ingeniero de Datos</text>
  <text x="280" y="63" text-anchor="middle" font-size="9.5" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">terraform CLI · cambio manual</text>

  <rect x="470" y="20" width="220" height="58" rx="6" fill="#FFFFFF" stroke="#B9C4CF" stroke-width="1.2"/>
  <text x="580" y="45" text-anchor="middle" font-size="13.5" font-weight="600" fill="#131C26" font-family="system-ui, sans-serif">Pipeline CI/CD</text>
  <text x="580" y="63" text-anchor="middle" font-size="9.5" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">plan / apply automatizado</text>

  <line x1="280" y1="78" x2="280" y2="100" stroke="#4A5A6B" stroke-width="1.4"/>
  <line x1="580" y1="78" x2="580" y2="100" stroke="#4A5A6B" stroke-width="1.4"/>
  <line x1="280" y1="100" x2="580" y2="100" stroke="#4A5A6B" stroke-width="1.4"/>
  <line x1="430" y1="100" x2="430" y2="136" stroke="#4A5A6B" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="446" y="124" font-size="9.5" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">sts:AssumeRole → rol de despliegue de la cuenta</text>

  <!-- ============ CUENTA DEV ============ -->
  <rect x="30" y="140" width="840" height="395" rx="10" fill="#FCFDFD" stroke="#0F6E68" stroke-width="1.6"/>
  <text x="52" y="171" font-size="11.5" font-weight="700" fill="#0F6E68" font-family="ui-monospace, Consolas, monospace" letter-spacing="0.9">CUENTA AWS · DEV</text>
  <text x="848" y="171" text-anchor="end" font-size="10" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">111122223333</text>

  <rect x="52" y="195" width="796" height="56" rx="6" fill="#FFFFFF" stroke="#B9C4CF" stroke-width="1.2"/>
  <text x="450" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#131C26" font-family="system-ui, sans-serif">Terraform</text>
  <text x="450" y="237" text-anchor="middle" font-size="9.5" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">backend "s3" → s3://tfstate-dev/streaming.tfstate</text>

  <!-- paso 1: bloquea -->
  <line x1="130" y1="251" x2="130" y2="358" stroke="#A9700E" stroke-width="1.8" marker-end="url(#arl)"/>
  <circle cx="130" cy="283" r="13" fill="#A9700E"/>
  <text x="130" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, Consolas, monospace">1</text>
  <text x="130" y="320" text-anchor="middle" font-size="9.5" fill="#A9700E" font-family="ui-monospace, Consolas, monospace">bloquea</text>

  <!-- paso 5: libera -->
  <line x1="230" y1="251" x2="230" y2="358" stroke="#A9700E" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arl)"/>
  <circle cx="230" cy="283" r="13" fill="#A9700E"/>
  <text x="230" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, Consolas, monospace">5</text>
  <text x="230" y="320" text-anchor="middle" font-size="9.5" fill="#A9700E" font-family="ui-monospace, Consolas, monospace">libera</text>

  <!-- paso 2: lee -->
  <line x1="390" y1="251" x2="390" y2="358" stroke="#4A5A6B" stroke-width="1.8" marker-end="url(#ar)"/>
  <circle cx="390" cy="283" r="13" fill="#3D4C5B"/>
  <text x="390" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, Consolas, monospace">2</text>
  <text x="390" y="320" text-anchor="middle" font-size="9.5" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">lee</text>

  <!-- paso 4: escribe -->
  <line x1="490" y1="251" x2="490" y2="358" stroke="#4A5A6B" stroke-width="1.8" marker-end="url(#ar)"/>
  <circle cx="490" cy="283" r="13" fill="#3D4C5B"/>
  <text x="490" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, Consolas, monospace">4</text>
  <text x="490" y="320" text-anchor="middle" font-size="9.5" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">escribe</text>

  <!-- paso 3: aplica -->
  <line x1="700" y1="251" x2="700" y2="358" stroke="#4A5A6B" stroke-width="1.8" marker-end="url(#ar)"/>
  <circle cx="700" cy="283" r="13" fill="#3D4C5B"/>
  <text x="700" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, Consolas, monospace">3</text>
  <text x="700" y="320" text-anchor="middle" font-size="9.5" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">aplica</text>

  <!-- DynamoDB -->
  <rect x="52" y="360" width="248" height="130" rx="6" fill="#FFFFFF" stroke="#B9C4CF" stroke-width="1.2"/>
  <text x="176" y="386" text-anchor="middle" font-size="10" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">Amazon DynamoDB · capa de locking</text>
  <text x="176" y="411" text-anchor="middle" font-size="14" font-weight="600" fill="#131C26" font-family="system-ui, sans-serif">locks-dev</text>
  <line x1="76" y1="426" x2="276" y2="426" stroke="#E4E9EE" stroke-width="1"/>
  <text x="176" y="448" text-anchor="middle" font-size="9.5" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">PK: LockID · escritura condicional</text>
  <text x="176" y="468" text-anchor="middle" font-size="9.5" fill="#A9700E" font-family="ui-monospace, Consolas, monospace">cifrado en reposo · CMK dev</text>

  <!-- S3 -->
  <rect x="320" y="360" width="250" height="130" rx="6" fill="#FFFFFF" stroke="#B9C4CF" stroke-width="1.2"/>
  <text x="445" y="386" text-anchor="middle" font-size="10" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">Amazon S3 · state remoto</text>
  <text x="445" y="411" text-anchor="middle" font-size="14" font-weight="600" fill="#131C26" font-family="system-ui, sans-serif">tfstate-dev</text>
  <line x1="344" y1="426" x2="546" y2="426" stroke="#E4E9EE" stroke-width="1"/>
  <text x="445" y="448" text-anchor="middle" font-size="9.5" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">objeto: streaming.tfstate</text>
  <text x="445" y="468" text-anchor="middle" font-size="9.5" fill="#A9700E" font-family="ui-monospace, Consolas, monospace">SSE-KMS · CMK dev · versioning ON</text>

  <!-- Recursos -->
  <rect x="600" y="360" width="248" height="130" rx="6" fill="#FFFFFF" stroke="#B9C4CF" stroke-width="1.2"/>
  <text x="724" y="386" text-anchor="middle" font-size="10" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">Recursos gestionados</text>
  <text x="724" y="411" text-anchor="middle" font-size="14" font-weight="600" fill="#131C26" font-family="system-ui, sans-serif">Plataforma de streaming</text>
  <line x1="624" y1="426" x2="824" y2="426" stroke="#E4E9EE" stroke-width="1"/>
  <text x="724" y="448" text-anchor="middle" font-size="9.5" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">Kinesis Data Streams · Redshift</text>
  <text x="724" y="468" text-anchor="middle" font-size="9.5" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">S3 raw · VPC · roles IAM</text>

  <!-- nota de aislamiento -->
  <line x1="52" y1="505" x2="848" y2="505" stroke="#DCE2E9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="450" y="523" text-anchor="middle" font-size="10" fill="#5A6B7C" font-family="ui-monospace, Consolas, monospace">El entorno prod vive en otra cuenta AWS (444455556666), con su propio bucket, su propia tabla y su propia CMK</text>

  <!-- ============ GOBERNANZA ============ -->
  <rect x="30" y="560" width="840" height="100" rx="8" fill="#FFFFFF" stroke="#B9C4CF" stroke-width="1.2"/>
  <text x="52" y="586" font-size="10.5" font-weight="700" fill="#131C26" font-family="ui-monospace, Consolas, monospace" letter-spacing="0.9">SEGURIDAD Y GOBERNANZA</text>

  <rect x="52" y="602" width="6" height="6" fill="#A9700E"/>
  <text x="68" y="609" font-size="10.5" fill="#3D4C5B" font-family="system-ui, sans-serif">State cifrado en reposo con SSE-KMS y una CMK propia de esta cuenta</text>
  <rect x="52" y="628" width="6" height="6" fill="#A9700E"/>
  <text x="68" y="635" font-size="10.5" fill="#3D4C5B" font-family="system-ui, sans-serif">Versioning activo en el bucket: cada escritura conserva la versión previa</text>

  <rect x="470" y="602" width="6" height="6" fill="#A9700E"/>
  <text x="486" y="609" font-size="10.5" fill="#3D4C5B" font-family="system-ui, sans-serif">Tabla de locks cifrada con la misma CMK del entorno</text>
  <rect x="470" y="628" width="6" height="6" fill="#A9700E"/>
  <text x="486" y="635" font-size="10.5" fill="#3D4C5B" font-family="system-ui, sans-serif">El state nunca se guarda en la máquina de un ingeniero</text>
</svg>
